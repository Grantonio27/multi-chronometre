name: Deploy GitHub Pages

on:
  push:
    branches:
      - main        # met à jour /ACC/
      - production  # met à jour la racine

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false   # évite d'annuler un déploiement en cours

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/production' && 'PRD' || 'ACC' }}
    steps:
      - name: Checkout main (ACC)
        uses: actions/checkout@v4
        with:
          ref: main
          path: acc_code

      - name: Checkout production (PRD)
        uses: actions/checkout@v4
        with:
          ref: production
          path: prd_code
        continue-on-error: true   # la branche production peut ne pas exister encore

      - name: Assembler le site (PRD à la racine + ACC dans /ACC)
        run: |
          mkdir -p build

          # 1. Production à la racine, si la branche existe
          if git -C prd_code rev-parse HEAD >/dev/null 2>&1; then
            rsync -av --exclude='.git' prd_code/ build/
          fi

          # 2. Main dans /ACC
          mkdir -p build/ACC
          rsync -av --exclude='.git' acc_code/ build/ACC/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './build'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
